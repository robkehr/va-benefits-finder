state: PA
program:
  name: Disabled Veterans Real Estate Tax Exemption
  statute: 51 Pa.C.S. §§ 8901–8903
  summary: Pennsylvania exempts the principal dwelling of qualifying 100% service-connected disabled veterans from real estate taxes. The exemption is administered by each county, and every applicant must demonstrate financial need. Counties do not publish fixed income limits; need is evaluated case by case from the income and expense information submitted with the application.
  base_eligibility:
    - Honorably discharged veteran with a 100% service-connected disability rating from the VA.
    - Service during a period of war as determined by the U.S. Department of Veterans Affairs.
    - The property must be the veteran's principal dwelling.
    - Financial need must be demonstrated to the county; there is no single statewide income limit.
    - On the veteran's death, the exemption may pass to a widowed spouse who can demonstrate financial need.
  how_to_apply:
    - File the DMVA Application for Disabled Veterans Real Estate Tax Exemption (OVA-BVP-001) with your county board of assessment appeals or county veterans affairs office, with proof of income and expenses for the financial-need review.
  source_url: https://www.pa.gov/content/dam/copapwp-pagov/en/dmva/documents/veterans/vetconnect/documents/ova-bvp-001%20application%20for%20disabled%20veterans%20real%20estate%20tax%20exemption%20(oct%202026).pdf
  source_name: PA DMVA — Application for Disabled Veterans Real Estate Tax Exemption (OVA-BVP-001)
