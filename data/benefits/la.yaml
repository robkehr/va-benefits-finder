  category: recreation
  summary: Eligible veterans may receive free hunting and fishing licenses, which must be renewed annually.
  value: Free hunting and fishing licenses
  eligibility:
    who: [veteran]
    min_rating: 50
    p_and_t: true
  how_to_apply:
