veteran must meet Texas residency and entry requirements, have at least 181 days of active duty excluding initial entry training, and meet other service, aid, course, and academic-progress rules. A general discharge must be under honorable conditions.\"]},\"how_to_apply\":[\"Be accepted by a Texas public college, register for a Hazlewood account, then submit the application packet and required documents to the college by its deadlines.\"],\"application_url\":\"https://www.tvc.texas.gov/education/hazlewood/\",\"source_url\":\"https://www.tvc.texas.gov/education/hazlewood/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"tx-disabled-veteran-residence-homestead-exemption\",\"name\":\"100% Disabled Veteran Residence Homestead Exemption\",\"state\":\"TX\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Exempts the total appraised value of a qualifying residence homestead from property tax.\",\"value\":\"Exemption of the total appraised value of a qualifying residence homestead\",\"source_name\":\"Texas Comptroller — 100% Disabled Veteran Residence Homestead Exemption FAQ\",\"eligibility\":{\"who\":[\"veteran\",\"surviving_spouse\"],\"requires_homeowner\":true,\"other_requirements\":[\"The veteran must receive VA disability compensation at the 100% rate due to a 100% disability rating or individual unemployability. A surviving spouse may qualify under the conditions on the official page.\"]},\"how_to_apply\":[\"Submit a Residence Homestead Application to the local appraisal district. The stated deadline is April 30; the official FAQ describes late-filing rules.\"],\"application_url\":\"https://comptroller.texas.gov/taxes/property-tax/exemptions/disabledvet-100-faq.php\",\"source_url\":\"https://comptroller.texas.gov/taxes/property-tax/exemptions/disabledvet-100-faq.php\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"UT\":[{\"id\":\"ut-disabled-veteran-property-tax-exemption\",\"name\":\"Veteran with a Disability Property Tax Exemption\",\"state\":\"UT\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Provides a property-tax exemption based on disability percentage; the official application describes a full current-year exemption for a veteran rated 100%, a proportionate exemption for a lesser rating, and no exemption below 10%.\",\"value\":\"Proportionate exemption based on disability rating, up to a full current-year exemption\",\"source_name\":\"Utah State Tax Commission — Veteran with a Disability Property Tax Exemption Application (PT-025)\",\"eligibility\":{\"who\":[\"veteran\",\"surviving_spouse\"],\"min_rating\":10,\"other_requirements\":[\"The initial application requires a military-entity statement showing the percentage of disability incurred or aggravated in the line of duty during war, international conflict, or military training. The form also lists unmarried surviving spouses and minor orphans among potential claimants.\"]},\"how_to_apply\":[\"File Form PT-025 with the county of residence by September 1; the county may request residency verification.\"],\"application_url\":\"https://files.tax.utah.gov/propertytax/form/pt-025.pdf\",\"source_url\":\"https://files.tax.utah.gov/propertytax/form/pt-025.pdf\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"ut-resident-disabled-veteran-hunting-fishing-license\",\"name\":\"Discounted Hunting, Fishing, or Combination License for Resident Veterans with Disabilities\",\"state\":\"UT\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"recreation\",\"summary\":\"Utah Division of Wildlife Resources lists discounted hunting, fishing, or combination licenses for resident veterans with qualifying service-connected disabilities.\",\"value\":\"Discounted license; amount depends on license selected\",\"source_name\":\"Utah Division of Wildlife Resources — Hunting and Fishing Opportunities for People with Disabilities\",\"eligibility\":{\"who\":[\"veteran\"],\"min_rating\":20,\"other_requirements\":[\"Requires Utah residency and a service-connected disability. Confirm license types and current discount with DWR.\"]},\"how_to_apply\":[\"Apply online through the link on the Utah Division of Wildlife Resources accessibility page.\"],\"application_url\":\"https://wildlife.utah.gov/accessibility\",\"source_url\":\"https://wildlife.utah.gov/accessibility\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"VA\":[{\"id\":\"va-disabled-veteran-principal-residence-property-tax-exemption\",\"name\":\"Exemption from Taxes on Property for Disabled Veterans\",\"state\":\"VA\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Virginia exempts qualifying veterans' principal-residence real property from taxation, subject to statutory dwelling, land, acreage, and ownership rules. A surviving spouse may qualify under the conditions in state law.\",\"value\":\"Real-property tax exemption for a qualifying principal residence\",\"source_name\":\"Code of Virginia — Sections 58.1-3219.5 and 58.1-3219.6\",\"eligibility\":{\"who\":[\"veteran\",\"surviving_spouse\"],\"min_rating\":100,\"p_and_t\":true,\"requires_homeowner\":true,\"other_requirements\":[\"Requires a VA-rated 100% service-connected, permanent-and-total disability. A surviving spouse may qualify if the veteran died on or after January 1, 2011 and the spouse has not remarried; acreage and ownership rules apply.\"]},\"how_to_apply\":[\"File an affidavit or written statement and VA disability documentation with the county, city, or town revenue officer.\"],\"application_url\":\"https://law.lis.virginia.gov/vacode/58.1-3219.6/\",\"source_url\":\"https://law.lis.virginia.gov/vacode/title58.1/chapter32/section58.1-3219.5/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"va-disabled-veteran-motor-vehicle-tax-exemption\",\"name\":\"Motor Vehicle Tax Exemption for a Disabled Veteran\",\"state\":\"VA\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"vehicle\",\"summary\":\"Exempts one qualifying personal-use passenger car or pickup/panel truck from taxation. A vehicle owned by a married person may qualify if either spouse is an eligible veteran.\",\"value\":\"Tax exemption for one qualifying vehicle\",\"source_name\":\"Code of Virginia — Section 58.1-3668, Motor Vehicle of a Disabled Veteran\",\"eligibility\":{\"who\":[\"veteran\"],\"min_rating\":100,\"p_and_t\":true,\"other_requirements\":[\"The vehicle must be owned and primarily used by or for an Armed Forces or Virginia National Guard veteran with a VA-rated 100% service-connected, permanent-and-total disability. The exemption ends at the veteran's death and does not continue for a surviving spouse.\"]},\"how_to_apply\":[\"Apply through the locality's procedure, if established.\"],\"application_url\":\"https://law.lis.virginia.gov/vacode/title58.1/chapter36/section58.1-3668/\",\"source_url\":\"https://law.lis.virginia.gov/vacode/title58.1/chapter36/section58.1-3668/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"VT\":[{\"id\":\"vt-veteran-assistance-fund\",\"name\":\"Vermont Veteran Assistance Fund\",\"state\":\"VT\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"financial\",\"summary\":\"May provide a one-time payment of up to $500 to a low-income Vermont veteran or family facing a financial crisis for a critical need such as housing or utilities.\",\"value\":\"One-time payment up to $500\",\"source_name\":\"Vermont Office of Veterans Affairs — Emergency Financial Assistance and Financial Support\",\"eligibility\":{\"who\":[\"veteran\"],\"other_requirements\":[\"Vermont residency and low-income financial crisis criteria apply; contact the Office of Veterans Affairs to confirm eligibility.\"]},\"how_to_apply\":[\"Apply by phone through the Vermont Office of Veterans Affairs.\"],\"application_url\":\"https://veterans.vermont.gov/benefits-and-services/veteran-benefits/emergency-financial-assistance-and-financial-support\",\"source_url\":\"https://veterans.vermont.gov/benefits-and-services/veteran-benefits/emergency-financial-assistance-and-financial-support\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"vt-veteran-high-school-diploma\",\"name\":\"High School Diplomas for Veterans\",\"state\":\"VT\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"education\",\"summary\":\"Veterans who served during World War II, the Korean War era, or the Vietnam War era and never received a high school diploma may apply for one from a Vermont public school.\",\"value\":\"Vermont public high school diploma\",\"source_name\":\"Vermont Office of Veterans Affairs — Recognition Your Service\",\"eligibility\":{\"who\":[\"veteran\"],\"other_requirements\":[\"Must have served in one of the listed periods and never received a high school diploma.\"]},\"how_to_apply\":[\"Submit the application to the Office of Veterans Affairs, which verifies eligibility and forwards it to the school.\"],\"application_url\":\"https://veterans.vermont.gov/benefits-and-services/veteran-benefits/recognition-your-service\",\"source_url\":\"https://veterans.vermont.gov/benefits-and-services/veteran-benefits/recognition-your-service\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"vt-veteran-license-plate\",\"name\":\"Veterans License Plate\",\"state\":\"VT\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"vehicle\",\"summary\":\"Vermont offers veterans plates for cars, trucks, and motorcycles; the Office of Veterans Affairs verifies service.\",\"value\":\"Veteran license plate; fees not specified in source summary\",\"source_name\":\"Vermont Office of Veterans Affairs — Recognition Your Service\",\"eligibility\":{\"who\":[\"veteran\"]},\"how_to_apply\":[\"Submit the certificate-of-veteran-status form and provide a DD-214 to the Office of Veterans Affairs.\"],\"application_url\":\"https://veterans.vermont.gov/benefits-and-services/veteran-benefits/recognition-your-service\",\"source_url\":\"https://veterans.vermont.gov/benefits-and-services/veteran-benefits/recognition-your-service\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"WA\":[{\"id\":\"wa-lifetime-disabled-veteran-pass\",\"name\":\"Lifetime Disabled Veteran Pass\",\"state\":\"WA\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"recreation\",\"summary\":\"Washington residents with a qualifying service-connected disability may receive a pass covering specified state-park and state-agency recreation fees, including free day-use parking and camping or moorage. Reservation and change fees may still apply.\",\"value\":\"Reduced or waived fees for specified recreational uses; some fees still apply\",\"source_name\":\"Washington State Department of Veterans Affairs — Free or Reduced Rate Passes and Tax Exemptions\",\"eligibility\":{\"who\":[\"veteran\"],\"min_rating\":30,\"other_requirements\":[\"Must be a Washington resident with a service-connected disability. See the current program page for covered activities and fees.\"]},\"how_to_apply\":[\"Submit the application linked on the page or contact Washington State Parks.\"],\"application_url\":\"https://dva.wa.gov/veterans-service-members-and-their-families/veterans-benefits/free-or-reduced-rate-passes-and-tax-exemptions\",\"source_url\":\"https://dva.wa.gov/veterans-service-members-and-their-families/veterans-benefits/free-or-reduced-rate-passes-and-tax-exemptions\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"wa-veteran-property-tax-relief\",\"name\":\"Property Tax Relief for Veterans\",\"state\":\"WA\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Income-based property-tax exemption or deferral relief may be available to qualifying homeowners, including veterans with a qualifying service-connected disability.\",\"value\":\"Income-based exemption or deferral; amount depends on eligibility and local assessed value\",\"source_name\":\"Washington State Department of Veterans Affairs — Property Tax Relief\" /\",\"source_url\":\"https://dva.wi.gov/benefits/outdoor-rec-and-sports/hunting-fishing-license/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"wi-private-nonprofit-schools-grant\",\"name\":\"Wisconsin Veterans Private Nonprofit Schools Grant\",\"state\":\"WI\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"education\",\"summary\":\"Provides eligible students at private nonprofit schools a grant capped at the lesser of $2,000 per semester or 50% of tuition minus applicable federal education benefits; the institution must match the grant.\",\"value\":\"Lesser of $2,000 per semester or 50% of tuition less applicable federal education benefits; school match required\",\"source_name\":\"Wisconsin Department of Veterans Affairs — Wisconsin Veterans Private Nonprofit Schools Grant\",\"eligibility\":{\"who\":[\"veteran\",\"spouse\",\"dependent_child\"],\"other_requirements\":[\"For dependent children, the page specifies an age range of 17–26. See the program page for remaining eligibility and matching-institution requirements.\"]},\"how_to_apply\":[\"Submit the WDVA certification form and the student application to the Wisconsin Higher Educational Aids Board.\"],\"application_url\":\"https://dva.wi.gov/benefits/education/private-nonprofit-schools-grant/\",\"source_url\":\"https://dva.wi.gov/benefits/education/private-nonprofit-schools-grant/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"WV\":[{\"id\":\"wv-disabled-or-older-homeowner-homestead-exemption\",\"name\":\"Twenty Thousand Dollar Homestead Exemption That May Apply to Veterans\",\"state\":\"WV\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"This is a general disabled-homeowner or older-homeowner exemption, not a veterans-only program. It can apply to a veteran who is at least 65 or certified permanently and totally disabled, if the owner occupies the homestead exclusively as a residence and meets residency rules.\",\"value\":\"$$20,000 homestead exemption, subject to program rules\",\"source_name\":\"West Virginia Code — Section 11-6B-3, Twenty Thousand Dollar Homestead Exemption\",\"eligibility\":{\"who\":[\"veteran\"],\"requires_homeowner\":true,\"other_requirements\":[\"The military-specific residency provision covers a person who was a West Virginia resident when entering military service, maintained the state as their residence during service, and returned after retirement or earlier separation due to permanent and total disability. The owner must meet the age or disability conditions and may not receive a similar homestead exemption in another state.\"]},\"how_to_apply\":[\"Submit an application and sworn affidavit; contact the county assessor for the filing office and current forms.\"],\"application_url\":\"https://code.wvlegislature.gov/11-6B-3/\",\"source_url\":\"https://code.wvlegislature.gov/11-6B-3/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"WY\":[{\"id\":\"wy-veterans-property-tax-exemption\",\"name\":\"Veterans Property Tax Exemption\",\"state\":\"WY\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Lowers the assessed value of eligible property by $3,000. If the exemption is not used on property, it may be applied to a vehicle licensing fee.\",\"value\":\"$$3,000 reduction in assessed value, or possible application to a vehicle licensing fee\",\"source_name\":\"Wyoming Military Department — Benefits, Resources and Military Records\",\"eligibility\":{\"who\":[\"veteran\",\"surviving_spouse\"],\"other_requirements\":[\"Requires at least three years of Wyoming residency and DD Form 214 or equivalent. Qualifying service includes specified wartime or overseas service, or a compensable service-connected disability. Certain surviving spouses who live in Wyoming and have not remarried may qualify.\"]},\"how_to_apply\":[\"Apply at the county assessor's office between January 1 and the fourth Monday in May.\"],\"application_url\":\"https://www.wyomilita
