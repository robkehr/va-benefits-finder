g Veterans\",\"state\":\"AZ\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"education\",\"summary\":\"A veteran using specified federal education assistance may qualify for immediate in-state classification at an Arizona public university or community college after discharge following at least 90 days of active duty.\",\"value\":\"In-state student classification for tuition purposes\",\"source_name\":\"Arizona Revised Statutes — Section 15-1802, In-State Student Status\",\"eligibility\":{\"who\":[\"veteran\"],\"other_requirements\":[\"Must use one of the specified federal education-assistance programs, have completed at least 90 days of active duty before discharge, and show objective evidence of intent to reside in Arizona, such as state voter registration, a driver license, vehicle registration, or employment history.\"]},\"how_to_apply\":[\"Present the evidence of Arizona residency intent described in the statute to the public institution.\"],\"application_url\":\"https://www.azleg.gov/ars/15/01802.htm\",\"source_url\":\"https://www.azleg.gov/ars/15/01802.htm\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"az-veteran-game-fish-license-fee-relief\",\"name\":\"Game and Fish Veteran License Fee Relief\",\"state\":\"AZ\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"recreation\",\"summary\":\"Arizona law authorizes the Game and Fish Commission to issue a complimentary license to certain veterans with qualifying disability and residency. The statute says the Commission may offer these licenses; current availability and application steps were not confirmed on an agency page.\",\"value\":\"Complimentary or reduced-fee license if offered by the Commission\",\"source_name\":\"Arizona Revised Statutes — Section 17-333, License Classifications and Fees\",\"eligibility\":{\"who\":[\"veteran\"],\"min_rating\":100,\"p_and_t\":true,\"other_requirements\":[\"The complimentary license provision requires at least one year of Arizona residency and federal compensation for a 100% permanent service-connected disability. The law also authorizes reduced-fee licenses for certain service-connected disabled veterans and resident Purple Heart recipients; verify current implementation.\"]},\"how_to_apply\":[\"Contact the Arizona Game and Fish Department to verify whether a license is currently offered and how to apply.\"],\"application_url\":\"https://www.azleg.gov/ars/17/00333.htm\",\"source_url\":\"https://www.azleg.gov/ars/17/00333.htm\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"CA\":[{\"id\":\"ca-disabled-veterans-property-tax-exemption\",\"name\":\"Disabled Veterans' Exemption\",\"state\":\"CA\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Reduces property tax liability on a qualified claimant's principal residence.\",\"value\":\"Exemption from a portion of the assessed value; amount depends on the applicable exemption and assessment\",\"source_name\":\"California Board of Equalization — Disabled Veterans' Exemption\",\"eligibility\":{\"who\":[\"veteran\",\"surviving_spouse\"],\"other_requirements\":[\"The veteran must have a qualifying service-connected disability, including 100% disability or compensation at the 100% rate due to unemployability, and qualifying service and discharge. Qualification is determined by the county assessor.\"]},\"how_to_apply\":[\"Review the forms and filing guidance and contact the county assessor to determine eligibility.\"],\"application_url\":\"https://www.boe.ca.gov/proptaxes/dv_exemption.htm\",\"source_url\":\"https://www.boe.ca.gov/proptaxes/dv_exemption.htm\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"CO\":[{\"id\":\"co-disabled-veteran-lifetime-small-game-fishing-license\",\"name\":\"Disabled Veterans Lifetime Small Game and Fishing Combination License\",\"state\":\"CO\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"recreation\",\"summary\":\"Colorado offers an eligible resident veteran a lifetime small-game and fishing combination license.\",\"value\":\"Lifetime small-game and fishing combination license\",\"source_name\":\"Colorado Parks and Wildlife — Hunters with Disabilities\",\"eligibility\":{\"who\":[\"veteran\"],\"other_requirements\":[\"Must be a Colorado resident and either a Purple Heart recipient or have a VA-rated service-connected disability with an overall combined rating of at least 50%.\"]},\"how_to_apply\":[\"Apply through a Colorado Parks and Wildlife account, submit electronically, or mail the application. The agency says to allow 15 business days for processing.\"],\"application_url\":\"https://cpw.state.co.us/activities/hunting/hunters-disabilities\",\"source_url\":\"https://cpw.state.co.us/activities/hunting/hunters-disabilities\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"co-veterans-day-free-state-park-entry-2026\",\"name\":\"Veterans Day Free Colorado State Park Entry (2026)\",\"state\":\"CO\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"recreation\",\"summary\":\"Colorado state parks offer free entry to veterans and active military members on November 11, 2026. Other park fees, such as camping or fishing, still apply.\",\"value\":\"Free state-park entry on November 11, 2026 only\",\"source_name\":\"Colorado Parks and Wildlife — Free Park Entry: Veterans and Active Military\",\"eligibility\":{\"who\":[\"veteran\"],\"other_requirements\":[\"Applies on November 11, 2026. Accepted service identification includes a DD-214, military identification, a Colorado ID marked Veteran, or a VA medical card. No registration is required.\"]},\"how_to_apply\":[\"Show accepted service identification at a Colorado state park on November 11, 2026.\"],\"application_url\":\"https://cpw.state.co.us/event/2026/11/free-park-entry-veterans-and-active-military\",\"source_url\":\"https://cpw.state.co.us/event/2026/11/free-park-entry-veterans-and-active-military\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\",\"notes\":\"This is a one-day event for November 11, 2026, not an ongoing benefit.\"}],\"CT\":[{\"id\":\"ct-veteran-license-plates\",\"name\":\"Veteran License Plates\",\"state\":\"CT\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"vehicle\",\"summary\":\"Connecticut's Department of Veterans Affairs lists veteran license plates as a state program. Plate types, fees, and detailed eligibility are not specified on the source page.\",\"value\":\"Details not specified on the source page\",\"source_name\":\"Connecticut Department of Veterans Affairs — Office of Advocacy and Assistance\",\"eligibility\":{},\"how_to_apply\":[\"Contact a Connecticut Department of Veterans Affairs Veteran Service Officer for application assistance.\"],\"application_url\":\"https://portal.ct.gov/dva/advocacy-and-assistance\",\"source_url\":\"https://portal.ct.gov/dva/advocacy-and-assistance\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"ct-veteran-driver-license-indicator\",\"name\":\"Veteran Indicator on Driver's License or Identification Card\",\"state\":\"CT\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"vehicle\",\"summary\":\"Connecticut's Department of Veterans Affairs lists a veteran indicator for a state driver's license or identification card. Documentation and fees are not specified on the source page.\",\"value\":\"Veteran indicator\",\"source_name\":\"Connecticut Department of Veterans Affairs — Office of Advocacy and Assistance\",\"eligibility\":{},\"how_to_apply\":[\"Contact a Connecticut Department of Veterans Affairs Veteran Service Officer for application assistance.\"],\"application_url\":\"https://portal.ct.gov/dva/advocacy-and-assistance\",\"source_url\":\"https://portal.ct.gov/dva/advocacy-and-assistance\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"DE\":[{\"id\":\"de-veteran-hunting-fishing-license-exemption\",\"name\":\"Veteran License Exemption\",\"state\":\"DE\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"recreation\",\"summary\":\"Delaware exempts qualifying veterans from hunting and fishing license fees.\",\"value\":\"Hunting and fishing license exemption\",\"source_name\":\"Delaware DNREC — Fishing and Hunting License Exemptions\",\"eligibility\":{\"who\":[\"veteran\"],\"min_rating\":60},\"how_to_apply\":[\"Complete the Veterans with Disabilities Exempt Application and submit it to DNREC's Division of Fish and Wildlife. The state page advises allowing up to four weeks.\"],\"application_url\":\"https://dnrec.delaware.gov/fish-wildlife/licenses/exemptions/\",\"source_url\":\"https://dnrec.delaware.gov/fish-wildlife/licenses/exemptions/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"FL\":[{\"id\":\"fl-total-permanent-disabled-veteran-homestead-exemption\",\"name\":\"Homestead Exemption for a Veteran with Total and Permanent Service-Connected Disability\",\"state\":\"FL\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"A qualifying veteran may receive a total exemption from ad valorem taxes on homestead property. The state guide also describes a similar exemption for certain veterans confined to wheelchairs.\",\"value\":\"Total exemption from ad valorem taxes on qualifying homestead property\",\"source_name\":\"Florida Department of Revenue — Property Tax Benefits for Active Duty Military and Veterans (PT-109)\",\"eligibility\":{\"who\":[\"veteran\"],\"requires_homeowner\":true,\"discharge\":[\"honorable\"],\"other_requirements\":[\"Requires Florida residency and a total, permanent, service-related disability; the official guide describes a separate wheelchair-related pathway. Confirm detailed criteria with the county property appraiser.\"]},\"how_to_apply\":[\"Apply through the county property appraiser and consult the state application guidance for current documents and deadlines.\"],\"application_url\":\"https://floridarevenue.com/property/Pages/Taxpayers_Exemptions.aspx\",\"source_url\":\"https://floridarevenue.com/property/Documents/pt109.pdf\",\"last_ve equires_homeowner\":true,\"other_requirements\":[\"Requires age 65 or older, Florida residency, a permanent disability, and other criteria described in the state guide. Certain surviving spouses may continue the discount under listed conditions.\"]},\"how_to_apply\":[\"Apply through the county property appraiser and consult the state application guidance for current documents and deadlines.\"],\"application_url\":\"https://floridarevenue.com/property/Pages/Taxpayers_Exemptions.aspx\",\"source_url\":\"https://floridarevenue.com/property/Documents/pt109.pdf\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"GA\":[{\"id\":\"ga-disabled-veteran-homestead-exemption\",\"name\":\"Disabled Veteran or Surviving Spouse Homestead Exemption\",\"state\":\"GA\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Georgia provides a homestead exemption for qualifying disabled veterans. Qualifying surviving spouses or minor children may continue to receive it while occupying the home.\",\"value\":\"Homestead property-tax exemption; amount depends on current statutory limits\",\"source_name\":\"Georgia Department of Revenue — Property Tax Homestead Exemptions\",\"eligibility\":{\"who\":[\"veteran\",\"surviving_spouse\",\"dependent_child\"],\"requires_homeowner\":true,\"other_requirements\":[\"The veteran must be a Georgia citizen and resident and own and occupy the home as a homestead. Surviving-spouse or minor-child continuation has additional conditions; confirm current requirements with the county.\"]},\"how_to_apply\":[\"File with the county tax commissioner or, in some counties, the tax assessor.\"],\"application_url\":\"https://dor.georgia.gov/property-tax-homestead-exemptions\",\"source_url\":\"https://dor.georgia.gov/property-tax-homestead-exemptions\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"ga-veterans-skilled-nursing-home-care\",\"name\":\"Georgia State Veterans Home Skilled Nursing Care\",\"state\":\"GA\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"other\",\"summary\":\"The Georgia Department of Veterans Service offers skilled nursing home care. The source summary does not specify admissions criteria.\",\"value\":\"Skilled nursing care; admission and cost details require confirmation\",\"source_name\":\"Georgia Department of Veterans Service — State Benefits for Georgia Veterans\",\"eligibility\":{\"who\":[\"veteran\"]},\"how_to_apply\":[\"Contact a Georgia Department of Veterans Service field office for information and application assistance.\"],\"application_url\":\"https://veterans.georgia.gov/state-benefits\",\"source_url\":\"https://veterans.georgia.gov/state-benefits\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"ga-veterans-cemetery-committal-services\",\"name\":\"Georgia Veterans Cemetery Committal Services\",\"state\":\"GA\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"other\",\"summary\":\"The Georgia Department of Veterans Service describes cemetery committal services for veterans. The source summary does not specify eligibility or application steps.\",\"value\":\"Cemetery committal services; details require confirmation\",\"source_name\":\"Georgia Department of Veterans Service — State Benefits for Georgia Veterans\",\"eligibility\":{\"who\":[\"veteran\"]},\"how_to_apply\":[\"Contact a Georgia Department of Veterans Service field office for information and application assistance.\"],\"application_url\":\"https://veterans.georgia.gov/state-benefits\",\"source_url\":\"https://veterans.georgia.gov/state-benefits\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"HI\":[{\"id\":\"hi-disabled-veteran-motor-vehicle-registration-exemption\",\"name\":\"Disabled Veteran Motor Vehicle Registration Fee Exemption\",\"state\":\"HI\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"vehicle\",\"summary\":\"Exempts $46 of the state vehicle registration fee for a qualifying veteran. The exemption applies to one vehicle and must be requested again each year.\",\"value\":\"$$46 of the state registration fee\",\"source_name\":\"Hawaii Office of Veterans' Services — Benefits and Services\",\"eligibility\":{\"who\":[\"veteran\"],\"min_rating\":100,\"discharge\":[\"honorable\",\"general\",\"oth\",\"other\"],\"other_requirements\":[\"Applicant must be a Hawaii resident with a VA-determined 100% service-connected disability rating and a discharge other than dishonorable.\"]},\"how_to_apply\":[\"Request an exemption letter from the Office of Veterans' Services with proof of Hawaii residency, current vehicle registration, and a current VA 100% disability letter.\"],\"application_url\":\"https://dod.hawaii.gov/ovs/benefits-and-services/\",\"source_url\":\"https://dod.hawaii.gov/ovs/benefits-and-services/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"IA\":[{\"id\":\"ia-disabled-veteran-homestead-tax-credit\",\"name\":\"Disabled Veteran Homestead Tax Credit\",\"state\":\"IA\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Provides a property-tax credit equal to the full amount of tax levied on an eligible homestead.\",\"value\":\"Credit equal to the full amount of property tax levied on an eligible homestead\",\"source_name\":\"Iowa Department of Revenue — Disabled Veteran Homestead Property Tax Credit\",\"eligibility\":{\"who\":[\"veteran\",\"surviving_spouse\",\"dependent_child\"],\"requires_homeowner\":true,\"other_requirements\":[\"Applicant must qualify for Iowa's homestead tax exemption and meet the definition of a qualifying disabled veteran, surviving spouse, or child under state law. For applications made on or after July 1, 2026, the source limits the homestead to one-half acre and excludes appurtenances.\"]},\"how_to_apply\":[\"Submit the Disabled Veteran Homestead Tax Credit Application, form 54-049.\"],\"application_url\":\"https://revenue.iowa.gov/taxes/tax-guidance/tax-credits-deductions-exemption/disabled-veteran-homestead-property-tax-credit\",\"source_url\":\"https://revenue.iowa.gov/taxes/tax-guidance/tax-credits-deductions-exemption/disabled-veteran-homestead-property-tax-credit\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"ia-military-retirement-benefits-exclusion\",\"name\":\"Military Retirement Benefits Exclusion\",\"state\":\"IA\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"financial\",\"summary\":\"Excludes qualifying military retirement benefits from Iowa individual income tax to the extent they are included in federal adjusted gross income. The state page also includes specified military survivor benefits.\",\"value\":\"Exclusion from Iowa individual income tax for qualifying military retirement income\",\"source_name\":\"Iowa Department of Revenue — Military Tax Information\",\"eligibility\":{\"who\":[\"veteran\",\"surviving_spouse\"],\"other_requirements\":[\"The state page says the exclusion applies to residents and nonresidents and is not age-limited. Confirm current tax-year rules with the Iowa Department of Revenue.\"]},\"how_to_apply\":[\"Follow the Iowa individual income tax return instructions; the source does not state a separate application.\"],\"application_url\":\"https://revenue.iowa.gov/taxes/tax-guidance/individual-income-tax/military-tax-information\",\"source_url\":\"https://revenue.iowa.gov/taxes/tax-guidance/individual-income-tax/military-tax-information\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"ID\":[{\"id\":\"id-disabled-veteran-property-tax-benefit\",\"name\":\"Property Tax Benefit for Veterans with a 100% Service-Connected Disability\",\"state\":\"ID\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"May reduce property taxes on an Idaho homeowner's primary residence and up to one acre. The state page says there is no income limit.\",\"value\":\"Property tax reduction; amount not stated here\",\"source_name\":\"Idaho State Tax Commission — Disabled Veteran Benefit\",\"eligibility\":{\"who\":[\"veteran\"],\"min_rating\":100,\"requires_homeowner\":true,\"other_requirements\":[\"For the 2027 benefit, applicants must be Idaho residents, have a qualifying 100% service-connected disability or 100% individual-unemployability compensation as of January 1, 2027, and own and live in an Idaho primary residence before April 15, 2027. A homeowner's exemption must apply.\"]},\"how_to_apply\":[\"Apply through the county assessor between January 1 and April 15, 2027, with current VA disability documentation. The state page says permanently and totally disabled recipients do not need to reapply annually.\"],\"application_url\":\"https://tax.idaho.gov/taxes/property/homeowners/veteran-benefit/\",\"source_url\":\"https://tax.idaho.gov/taxes/property/homeowners/veteran-benefit/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"IL\":[{\"id\":\"il-disabled-veteran-hunting-fishing-license-exemption\",\"name\":\"Free Hunting and Fishing License or Privilege for Disabled Veterans\",\"state\":\"IL\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"recreation\",\"summary\":\"Qualifying disabled veterans do not need to purchase Illinois hunting and fishing licenses. The state page says this applies regardless of state residency.\",\"value\":\"Hunting and fishing license exemption\",\"source_name\":\"Illinois Department of Veterans' Affairs — Fishing and Hunting Permits\",\"eligibility\":{\"who\":[\"veteran\"],\"other_requirements\":[\"The state page lists veterans receiving at least 10% service-connected compensation or a total-disability pension. Verify the qualifying documentation with IDVA.\"]},\"how_to_apply\":[\"Contact a local IDVA Veteran Service Office for the required Disability Affidavit. The page lists a DD-214 and current VA compensation or pension verification as required documents.\"],\"application_url\":\"https://veterans.illinois.gov/services-benefits/permits.html\",\"source_url\":\"https://veterans.illinois.gov/services-benefits/permits.html\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"IN\":[{\"id\":\"in-disabled-veteran-property-tax-benefit\",\"name\":\"Disabled Veteran Property Tax Benefits\",\"state\":\"IN\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Eligible veterans may receive a deduction equal to the full assessed value of their principal residence.\",\"value\":\"Deduction equal to the full assessed value of the qualifying principal residence\",\"source_name\":\"Indiana Department of Veterans' Affairs — Disabled Veteran Property Tax Benefits\",\"eligibility\":{\"who\":[\"veteran\"],\"requires_homeowner\":true,\"discharge\":[\"honorable\"],\"other_requirements\":[\"Requires at least 90 days of service, a total disability, and at least one year of Indiana residence before the assessment date.\"]},\"how_to_apply\":[\"Submit State Form 12662 through a county Veteran Service Officer, county auditor, or the Indiana Department of Veterans Affairs. The state page lists a DD-214 and VA disability award letter as required documents.\"],\"application_url\":\"https://www.in.gov/dva/divisions/training-and-services/disabled-veteran-property-tax-deduction/\",\"source_url\":\"https://www.in.gov/dva/divisions/training-and-services/disabled-veteran-property-tax-deduction/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"in-veteran-dependent-tuition-fee-exemption\",\"name\":\"Tuition and Fee Exemption\",\"state\":\"IN\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"education\",\"summary\":\"Provides eligible students up to 124 credit hours of tuition and fee exemption at state-supported schools.\",\"value\":\"Up to 124 credit hours of tuition and fees\",\"source_name\":\"Indiana Department of Veterans' Affairs — Tuition and Fee Exemption\",\"eligibility\":{\"who\":[\"dependent_child\"],\"other_requirements\":[\"Qualifying groups include certain children of Indiana veterans, Indiana Purple Heart recipients, and former students of the Indiana Soldiers' and Sailors' Home. Confirm the specific eligibility category with the state.\"]},\"how_to_apply\":[\"Apply through ScholarTrack. Approved students must also file a FAFSA for each year they use the exemption.\"],\"application_url\":\"https://www.in.gov/dva/divisions/training-and-services/tuition-and-fee-exemption/\",\"source_url\":\"https://www.in.gov/dva/divisions/training-and-services/tuition-and-fee-exemption/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"in-disabled-veteran-discounted-hunting-fishing-license\",\"name\":\"Disabled Veteran Discounted Hunting and Fishing License\",\"state\":\"IN\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"recreation\",\"summary\":\"Eligible Indiana residents may buy a discounted hunting and fishing license covering small game and fishing; stamps are excluded.\",\"value\":\"$$2.75 for one year or $27.50 for ten years, as stated on the state page\",\"source_name\":\"Indiana Department of Veterans' Affairs — Disabled Veteran Discounted Hunting and Fishing License\",\"eligibility\":{\"who\":[\"veteran\"],\"other_requirements\":[\"Indiana residency and qualifying military service and service-connected disability or military disability-retirement benefit are required.\"]},\"how_to_apply\":[\"Submit State Form 50833 to the Department of Natural Resources by mail or in person.\"],\"application_url\":\"https://www.in.gov/dva/divisions/training-and-services/disabled-veteran-discounted-hunting-and-fishing-license-and-golden-hoosier-passport/\",\"source_url\":\"https://www.in.gov/dva/divisions/training-and-services/disabled-veteran-discounted-hunting-and-fishing-license-and-golden-hoosier-passport/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"KS\":[{\"id\":\"ks-disabled-veteran-sales-tax-exemption\",\"name\":\"Disabled Veteran Sales Tax Exemption\",\"state\":\"KS\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"financial\",\"summary\":\"Effective July 1, 2026, qualifying purchases of tangible personal property and services are exempt from Kansas retailers' sales tax up to an annual limit. Motor vehicles, alcohol, tobacco, e-cigarettes, and related consumables are excluded; exempt purchases must be for personal use.\",\"value\":\"Up to $24,000 in qualifying purchases per eligible person per year\",\"source_name\":\"Kansas Statutes — Section 79-3606h, Disabled Veteran Sales Tax Exemption\",\"eligibility\":{\"who\":[\"veteran\",\"surviving_spouse\"],\"discharge\":[\"honorable\"],\"other_requirements\":[\"Applicant must be a Kansas resident and VA-certified as having a permanent 100% disability or being totally disabled or unemployable due to a qualifying disability sustained through military action or accident, or disease contracted in active service. A qualifying surviving spouse may continue the exemption until remarriage.\"]},\"how_to_apply\":[\"Apply to the Kansas Secretary of Revenue for a veteran exemption identification number and exemption certificate card. Present the card or number when claiming the exemption.\"],\"application_url\":\"https://ksrevisor.gov/statutes/chapters/ch79/079_036_0006h.html\",\"source_url\":\"https://ksrevisor.gov/statutes/chapters/ch79/079_036_0006h.html\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"KY\":[{\"id\":\"ky-veterans-nursing-homes\",\"name\":\"Access to Kentucky Veterans' Nursing Homes\",\"state\":\"KY\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"other\",\"summary\":\"The Kentucky Department of Veterans Affairs lists access to veterans' nursing homes among state benefits. The overview does not specify admission criteria.\",\"value\":\"Long-term care services; admission and cost details require confirmation\",\"source_name\":\"Kentucky Department of Veterans Affairs — Benefits\",\"eligibility\":{\"who\":[\"veteran\"]},\"how_to_apply\":[\"Contact a Kentucky Department of Veterans Affairs benefits representative for assistance and current admission requirements.\"],\"application_url\":\"https://veterans.ky.gov/Benefits/Pages/default.aspx\",\"source_url\":\"https://veterans.ky.gov/Benefits/Pages/default.aspx\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"ky-veterans-cemetery-burial-honors\",\"name\":\"Burial with Honors in Kentucky Veterans Cemeteries\",\"state\":\"KY\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"other\",\"summary\":\"The Kentucky Department of Veterans Affairs lists burial with honors in veterans cemeteries as a benefit. The overview does not specify detailed eligibility or arrangements.\",\"value\":\"Burial with honors; confirm cemetery and service details with KDVA\",\"source_name\":\"Kentucky Department of Veterans Affairs — Benefits\",\"eligibility\":{\"who\":[\"veteran\"]},\"how_to_apply\":[\"Contact a Kentucky Department of Veterans Affairs benefits representative for eligibility and arrangement assistance.\"],\"application_url\":\"https://veterans.ky.gov/Benefits/Pages/default.aspx\",\"source_url\":\"https://veterans.ky.gov/Benefits/Pages/default.aspx\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"LA\":[{\"id\":\"la-disabled-veteran-property-tax-exemption\",\"name\":\"Disabled Veteran Property Tax Exemption\",\"state\":\"LA\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Louisiana provides property-tax relief on a qualifying veteran's primary residence. The exemption increases with qualifying disability rating, with a full ad valorem exemption at a 100% rating, subject to municipal-assessment exceptions described by the state.\",\"value\":\"Property-tax exemption varies with disability rating; full ad valorem exemption at 100%, subject to stated exceptions\",\"source_name\":\"Louisiana Department of Veterans Affairs — State Benefits\",\"eligibility\":{\"who\":[\"veteran\"],\"min_rating\":50,\"requires_homeowner\":true,\"other_requirements\":[\"The state describes this for a service-connected disability and a primary residence. Review the official source for local assessment exceptions and current filing requirements.\"]},\"how_to_apply\":[\"Review the Louisiana Department of Veterans Affairs state-benefits page and contact the parish veterans service office for local filing guidance.\"],\"application_url\":\"https://vetaffairs.la.gov/benefits/state/\",\"source_url\":\"https://vetaffairs.la.gov/benefits/state/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"la-title-29-in-state-tuition-exemption\",\"name\":\"Title 29 In-State Tuition Exemption\",\"state\":\"LA\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"education\",\"summary\":\"Provides an in-state tuition exemption for eligible veteran dependents at Louisiana schools.\",\"value\":\"In-state tuition exemption\",\"source_name\":\"Louisiana Department of Veterans Affairs — Title 29 In-State Tuition Exemption\",\"eligibility\":{\"who\":[\"dependent_child\",\"spouse\",\"surviving_spouse\"],\"other_requirements\":[\"Eligible groups include children of living veterans, spouses of veterans who are prisoners of war or missing in action, and spouses or children of deceased veterans, subject to residency and other requirements.\"]},\"how_to_apply\":[\"Contact a parish veterans service office to schedule an appointment with a veterans assistance counselor. If approved, the counselor sends the certificate for processing.\"],\"application_url\":\"https://vetaffairs.la.gov/education/title-29\",\"source_url\":\"https://vetaffairs.la.gov/education/title-29\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"la-disabled-veteran-hunting-fishing-license\",\"name\":\"Free Hunting and Fishing Licenses\",\"state\":\"LA\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"recreation\",\"summary\":\"Eligible veterans may receive free hunting and fishing licenses, which must be renewed annually.\",\"value\":\"Free hunting and fishing licenses\",\"source_name\":\"Louisiana Department of Veterans Affairs — State Benefits\",\"eligibility\":{\"who\":[\"veteran\"],\"min_rating\":50,\"p_and_t\":true},\"how_to_apply\":[\"Review the Louisiana Department of Veterans Affairs state-benefits page for current license and annual renewal instructions.\"],\"application_url\":\"https://vetaffairs.la.gov/benefits/state/\",\"source_url\":\"https://vetaffairs.la.gov/benefits/state/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"MA\":[{\"id\":\"ma-veterans-property-tax-exemption\",\"name\":\"Veterans' Property Tax Exemption\",\"state\":\"MA\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Massachusetts law provides a property-tax exemption for qualifying veterans' domiciles.\",\"value\":\"Property-tax exemption under the qualifying statutory category\",\"source_name\":\"Massachusetts General Laws — Chapter 59, Section 5: Property Exemptions\",\"eligibility\":{\"who\":[\"veteran\"],\"other_requirements\":[\"Qualifying cases include a service-related disability rating of at least 10% or receipt of the Purple Heart. The veteran must be a Massachusetts legal resident, have a last discharge other than dishonorable, and meet the statute's domicile and residency requirements.\"]},\"how_to_apply\":[\"Contact the local assessor about application procedures and documentation.\"],\"application_url\":\"https://malegislature.gov/Laws/GeneralLaws/PartI/TitleIX/Chapter59/Section5\",\"source_url\":\"https://malegislature.gov/Laws/GeneralLaws/PartI/TitleIX/Chapter59/Section5\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"MD\":[{\"id\":\"md-disabled-veterans-property-tax-exemption\",\"name\":\"State Property Tax Exemption for Disabled Veterans\",\"state\":\"MD\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"An exemption from real-property taxes on a dwelling house and surrounding yard may be available to qualifying disabled veterans and certain surviving spouses.\",\"value\":\"Real-property tax exemption on a qualifying dwelling house and surrounding yard\",\"source_name\":\"Maryland Department of Veterans and Military Families — State Property Tax Exemptions\",\"eligibility\":{\"who\":[\"veteran\",\"surviving_spouse\"],\"min_rating\":100,\"p_and_t\":true,\"requires_homeowner\":true,\"other_requirements\":[\"The veteran must have a VA-rated 100% service-connected, permanent-and-total disability. The official page also describes eligible disabled active-duty members and certain surviving spouses.\"]},\"how_to_apply\":[\"Apply using the relevant state application. Veterans and surviving spouses may apply at any time; contact the local assessment office with eligibility questions.\"],\"application_url\":\"https://veterans.maryland.gov/benefits-services/tax-exemptions/state-property-tax-exemptions/\",\"source_url\":\"https://veterans.maryland.gov/benefits-services/tax-exemptions/state-property-tax-exemptions/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"md-military-retirement-pay-tax-deduction\",\"name\":\"Military Retirement Pay Income Tax Deduction\",\"state\":\"MD\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"financial\",\"summary\":\"Qualifying military retirees or spouses of military retirees may subtract eligible military retirement income when calculating Maryland income tax.\",\"value\":\"Up to $20,000 for taxpayers age 55 or older, or up to $12,500 for those under 55, as stated on the state page\",\"source_name\":\"Maryland Department of Veterans and Military Families — Retirement Pay and Pension Tax Deductions and Exclusion\",\"eligibility\":{\"who\":[\"veteran\",\"spouse\"],\"other_requirements\":[\"The deduction applies to qualifying military retirement income; confirm current eligibility and tax-year instructions with the state.\"]},\"how_to_apply\":[\"Complete Maryland Form 502 and follow the resident tax booklet instructions for line 13.\"],\"application_url\":\"https://veterans.maryland.gov/benefits-services/tax-exemptions/retirement-pay-and-pension-tax-deductions-and-exclusion/\",\"source_url\":\"https://veterans.maryland.gov/benefits-services/tax-exemptions/retirement-pay-and-pension-tax-deductions-and-exclusion/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"md-disabled-veteran-license-plates\",\"name\":\"100% Disabled Veterans License Plates\",\"state\":\"MD\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"vehicle\",\"summary\":\"Maryland veterans rated 100% disabled may receive disabled veteran plates without charge.\",\"value\":\"Plates free of charge\",\"source_name\":\"Maryland Motor Vehicle Administration — Military and Veteran License Plates\",\"eligibility\":{\"who\":[\"veteran\"],\"min_rating\":100},\"how_to_apply\":[\"Schedule an appointment with the Maryland Motor Vehicle Administration and bring documentation of the disability percentage.\"],\"application_url\":\"https://mva.maryland.gov/your-mva-guide/military-service-members/license-plates\",\"source_url\":\"https://mva.maryland.gov/your-mva-guide/military-service-members/license-plates\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"ME\":[{\"id\":\"me-veterans-property-tax-exemption\",\"name\":\"Veterans' Property Tax Exemption\",\"state\":\"ME\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Exempts up to $6,000 of just value for qualifying property at a veteran's place of residence.\",\"value\":\"Exemption of up to $6,000 of just value\",\"source_name\":\"Maine Revised Statutes — Title 36, Section 653: Veterans' Exemptions\",\"eligibility\":{\"who\":[\"veteran\"],\"other_requirements\":[\"Eligibility includes veterans with qualifying wartime or expeditionary-medal service who are age 62 or older or receive federal compensation for total disability. A separate provision covers veterans with total service-connected disability who receive federal compensation. Review the statute for details.\"]},\"how_to_apply\":[\"Contact the local assessor for application instructions; the statute does not specify a filing procedure.\"],\"application_url\":\"https://legislature.maine.gov/statutes/36/title36sec653.html\",\"source_url\":\"https://legislature.maine.gov/statutes/36/title36sec653.html\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"MI\":[{\"id\":\"mi-children-veterans-tuition-grant\",\"name\":\"Michigan Children of Veterans Tuition Grant\",\"state\":\"MI\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"education\",\"summary\":\"Provides undergraduate tuition assistance to a veteran's child if the veteran died while on active federal duty or has a VA total-and-permanent disability rating.\",\"value\":\"Undergraduate tuition assistance; amount depends on program rules\",\"source_name\":\"Michigan Veterans Affairs Agency — Benefits for Family Members\",\"eligibility\":{\"who\":[\"dependent_child\"],\"other_requirements\":[\"The veteran must have died while on active federal duty or have a VA total-and-permanent disability rating.\"]},\"how_to_apply\":[\"Contact the Michigan Department of Treasury using the phone number listed on the program page for current application information.\"],\"application_url\":\"https://www.michigan.gov/mvaa/education/resources-for-veterans-and-family-members/fam-ben\",\"source_url\":\"https://www.michigan.gov/mvaa/education/resources-for-veterans-and-family-members/fam-ben\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"MN\":[{\"id\":\"mn-disabled-veteran-homestead-exclusion\",\"name\":\"Homestead of Veteran with a Disability or Family Caregiver\",\"state\":\"MN\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Excludes part of a qualifying homestead's market value from taxable market value: $150,000 for a disability rating of at least 70%, or $300,000 for a 100% permanent disability.\",\"value\":\"$$150,000 taxable-market-value exclusion at 70% disability; $300,000 at 100% permanent disability\",\"source_name\":\"Minnesota Revisor of Statutes — Homestead of Veteran with a Disability or Family Caregiver\",\"eligibility\":{\"who\":[\"veteran\",\"surviving_spouse\"],\"requires_homeowner\":true,\"other_requirements\":[\"The veteran must have a VA-certified service-connected disability of at least 70% and an honorable discharge. State law also specifies circumstances for family caregivers and surviving spouses.\"]},\"how_to_apply\":[\"Apply to the assessor by December 31 of the first assessment year for which the exclusion is sought.\"],\"application_url\":\"https://www.revisor.mn.gov/statutes/cite/273.13\",\"source_url\":\"https://www.revisor.mn.gov/statutes/cite/273.13\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"MO\":[{\"id\":\"mo-returning-heroes-education-act\",\"name\":\"Missouri Returning Heroes' Education Act\",\"state\":\"MO\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"education\",\"summary\":\"Limits tuition at participating public institutions to $50 per credit hour for qualifying combat veterans in certificate, associate, or bachelor's programs; graduate tuition is limited to no more than 30% of tuition and fees.\",\"value\":\"$$50 per credit hour for qualifying undergraduate programs; graduate tuition limited to 30% of tuition and fees\",\"source_name\":\"Missouri Revised Statutes — Section 173.900\",\"eligibility\":{\"who\":[\"veteran\"],\"discharge\":[\"honorable\"],\"other_requirements\":[\"Must document combat service and be eligible to vote in Missouri or be a current Missouri resident. Undergraduate students also need a cumulative GPA of at least 2.5; time limits apply after discharge.\"]},\"how_to_apply\":[\"Contact the participating public institution about its procedure; the cited statute does not specify application steps.\"],\"application_url\":\"https://revisor.mo.gov/main/OneSection.aspx?section=173.900\",\"source_url\":\"https://revisor.mo.gov/main/OneSection.aspx?section=173.900\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"MS\":[{\"id\":\"ms-disabled-veteran-ad-valorem-exemption\",\"name\":\"Ad Valorem Tax Exemption\",\"state\":\"MS\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"The Mississippi Veterans Affairs 2024–2025 handbook says an honorably discharged veteran with total service-connected disability is exempt from ad valorem taxes on the assessed value of homestead property; it extends the exemption to an unremarried surviving spouse.\",\"value\":\"Ad valorem tax exemption on assessed homestead value\",\"source_name\":\"Mississippi Veterans Affairs — State Benefits Handbook, 2024–2025\",\"eligibility\":{\"who\":[\"veteran\",\"surviving_spouse\"],\"min_rating\":100,\"requires_homeowner\":true,\"discharge\":[\"honorable\"],\"other_requirements\":[\"The handbook says an eligible surviving spouse must not have remarried. Verify current program details with the state or county.\"]},\"how_to_apply\":[\"Contact the county tax assessor or the Mississippi Veterans Affairs office for current application instructions.\"],\"application_url\":\"https://msva.ms.gov/benefits/\",\"source_url\":\"https://static1.squarespace.com/static/5c534b122727be7fb7922414/t/6740bf850f3cca7f7879d6b5/1732296583799/Benefit+Book+2024+2025.pdf\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\",\"notes\":\"Details are from the 2024–2025 handbook linked by the state agency and may not reflect later changes.\"},{\"id\":\"ms-disabled-veteran-hunting-fishing-license-exemption\",\"name\":\"Hunting and Fishing License Exemption\",\"state\":\"MS\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"recreation\",\"summary\":\"Veterans with total service-connected disability from the VA are not required to purchase hunting or fishing licenses under the state-agency 2024–2025 handbook.\",\"value\":\"Hunting and fishing license exemption\",\"source_name\":\"Mississippi Veterans Affairs — State Benefits Handbook, 2024–2025\",\"eligibility\":{\"who\":[\"veteran\"],\"min_rating\":100,\"other_requirements\":[\"While hunting or fishing, carry proof of age, residency, and disability status as described in the handbook.\"]},\"how_to_apply\":[\"Review current requirements with the Mississippi Department of Wildlife, Fisheries, and Parks before using the exemption.\"],\"application_url\":\"https://msva.ms.gov/benefits/\",\"source_url\":\"https://static1.squarespace.com/static/5c534b122727be7fb7922414/t/6740bf850f3cca7f7879d6b5/1732296583799/Benefit+Book+2024+2025.pdf\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\",\"notes\":\"Details are from the 2024–2025 handbook linked by the state agency and may not reflect later changes.\"},{\"id\":\"ms-veteran-in-state-tuition\",\"name\":\"In-State Tuition for Veterans and Education-Benefit Recipients\",\"state\":\"MS\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"education\",\"summary\":\"The Mississippi Veterans Affairs 2024–2025 handbook says veterans as defined by Title 38, or people entitled to Title 38 veterans' educational assistance, are authorized in-state tuition.\",\"value\":\"In-state tuition rate\",\"source_name\":\"Mississippi Veterans Affairs — State Benefits Handbook, 2024–2025\",\"eligibility\":{\"who\":[\"veteran\",\"spouse\",\"dependent_child\"],\"other_requirements\":[\"The handbook refers to veterans as defined by Title 38 and people entitled to Title 38 veterans' educational assistance. Confirm current campus application details.\"]},\"how_to_apply\":[\"Contact the institution's veterans office or registrar; the handbook does not specify application steps.\"],\"application_url\":\"https://msva.ms.gov/benefits/\",\"source_url\":\"https://static1.squarespace.com/static/5c534b122727be7fb7922414/t/6740bf850f3cca7f7879d6b5/1732296583799/Benefit+Book+2024+2025.pdf\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\",\"notes\":\"Details are from the 2024–2025 handbook linked by the state agency and may not reflect later changes.\"}],\"MT\":[{\"id\":\"mt-disabled-veterans-property-tax-assistance\",\"name\":\"Montana Disabled Veterans Assistance Program\",\"state\":\"MT\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Reduces the property tax rate on a home for eligible veterans with a 100% service-connected disability or a qualifying unmarried surviving spouse.\",\"value\":\"Reduced property tax rate; amount depends on the program calculation\",\"source_name\":\"Montana Department of Revenue — Montana Disabled Veterans Assistance Program\",\"eligibility\":{\"who\":[\"veteran\",\"surviving_spouse\"],\"min_rating\":100,\"requires_homeowner\":true,\"other_requirements\":[\"For tax year 2027, applicants must own or be under contract to buy the home, use it as a primary residence for at least seven months of the year, and meet the income limit for their marital status. Annual income and property requirements apply.\"]},\"how_to_apply\":[\"Apply by April 15 using the electronic application or paper MDV form submitted to a local field office.\"],\"application_url\":\"https://revenue.mt.gov/property/property-tax-help/mdv\",\"source_url\":\"https://revenue.mt.gov/property/property-tax-help/mdv\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"mt-veteran-state-parks-camping-discount\",\"name\":\"Montana Veteran State Parks Camping Discount\",\"state\":\"MT\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"recreation\",\"summary\":\"Montana residents with veteran status receive 50% off state-park camping fees. The discount does not apply to electrical fees.\",\"value\":\"50% off camping fees, excluding electrical fees\",\"source_name\":\"Montana Fish, Wildlife and Parks — Fees and General Information\",\"eligibility\":{\"who\":[\"veteran\"],\"other_requirements\":[\"Must be a Montana resident with veteran status and provide proof such as a DD-214, VA ID, or driver license showing veteran status.\"]},\"how_to_apply\":[\"Present proof of eligibility when arranging camping; the source does not specify a separate application.\"],\"application_url\":\"https://fwp.mt.gov/buyandapply/fees-and-general-information\",\"source_url\":\"https://fwp.mt.gov/buyandapply/fees-and-general-information\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"NC\":[{\"id\":\"nc-veteran-government-employment-preference\",\"name\":\"Employment Preference for Servicemembers, Veterans, and Their Spouses\",\"state\":\"NC\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"employment\",\"summary\":\"North Carolina provides employment preference for veterans, disabled veterans, their spouses, and National Guard members when applying for state, county, and local government jobs. A 2026 law expanded preference to spouses of active-duty servicemembers.\",\"value\":\"Preference in qualifying public-sector hiring\",\"source_name\":\"North Carolina Department of Military and Veterans Affairs — Employment Preference\",\"eligibility\":{\"who\":[\"veteran\",\"spouse\"],\"other_requirements\":[\"The agency page quotes statutory service-period criteria for veterans. It also describes disabled veterans, National Guard members, and spouses of active-duty servicemembers; confirm applicable preference for the job and applicant.\"]},\"how_to_apply\":[\"Apply for the relevant government job and follow its instructions for claiming preference.\"],\"application_url\":\"https://www.milvets.nc.gov/benefits-services/employment\",\"source_url\":\"https://www.milvets.nc.gov/benefits-services/employment\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"ncworks-veteran-early-job-posting-access\",\"name\":\"NCWorks Veteran Early Access to Job Postings\",\"state\":\"NC\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"employment\",\"summary\":\"Veterans can view job postings on North Carolina's official job-search site 24 hours before they become available to the general public.\",\"value\":\"24-hour early access to job postings\",\"source_name\":\"North Carolina Department of Military and Veterans Affairs — Employment Preference\",\"eligibility\":{\"who\":[\"veteran\"]},\"how_to_apply\":[\"Use NCWorks Online to search for jobs.\"],\"application_url\":\"https://www.ncworks.gov/\",\"source_url\":\"https://www.milvets.nc.gov/benefits-services/employment\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"ND\":[{\"id\":\"nd-disabled-veteran-property-tax-credit\",\"name\":\"Disabled Veteran's Property Tax Credit\",\"state\":\"ND\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Reduces taxable valuation on a veteran's homestead by an amount tied to disability rating. The state lists a maximum reduction from $4,500 at a 50% rating to $9,000 at 100%.\",\"value\":\"Taxable-valuation reduction up to $9,000, depending on rating\",\"source_name\":\"North Dakota Office of State Tax Commissioner — Disabled Veteran's Property Tax Credit\",\"eligibility\":{\"who\":[\"veteran\",\"surviving_spouse\"],\"requires_homeowner\":true,\"other_requirements\":[\"Requires a service-connected disability rating of at least 50%, or an extra-schedular/individual-unemployability rating paid at the 100% rate; qualifying discharge or retirement; and an ownership interest in and residence at the property. The state page also specifies surviving-spouse eligibility.\"]},\"how_to_apply\":[\"The state says the credit is automatically applied for those who qualify; contact the county assessor if it is not reflected.\"],\"application_url\":\"https://www.tax.nd.gov/disabled-veterans-property-tax-credit\",\"source_url\":\"https://www.tax.nd.gov/disabled-veterans-property-tax-credit\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"NE\":[{\"id\":\"ne-veterans-aid-fund\",\"name\":\"Nebraska Veterans Aid Fund\",\"state\":\"NE\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"financial\",\"summary\":\"Provides temporary emergency aid when an emergency disrupts normal living arrangements and other resources are not immediately available. Covered needs include listed items such as food, shelter, transportation, and medical items.\",\"value\":\"Temporary emergency aid; amount depends on need and program rules\",\"source_name\":\"Nebraska Department of Veterans' Affairs — Nebraska Veterans Aid Fund\",\"eligibility\":{\"who\":[\"veteran\",\"spouse\",\"surviving_spouse\",\"dependent_child\"],\"other_requirements\":[\"The state defines eligible veterans to include those honorably or generally discharged, those who died in service or as a direct result of service, and certain U.S. citizens who served with allied forces.\"]},\"how_to_apply\":[\"Apply through a State Service Officer, County Veterans Service Officer, or recognized veterans organization's Post Service Officer.\"],\"application_url\":\"https://veterans.nebraska.gov/nebraska-veterans-aid-fund-nva\",\"source_url\":\"https://veterans.nebraska.gov/nebraska-veterans-aid-fund-nva\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"ne-veterans-tuition-waiver\",\"name\":\"Waiver of Tuition\",\"state\":\"NE\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"education\",\"summary\":\"Waives 100% of tuition charges and tuition-related fees at participating University of Nebraska campuses, state colleges, and community colleges. It does not cover housing, food, parking, or other non-tuition costs.\",\"value\":\"100% of qualifying tuition charges and tuition-related fees\",\"source_name\":\"Nebraska Department of Veterans' Affairs — Waiver of Tuition\",\"eligibility\":{\"who\":[\"veteran\",\"spouse\",\"dependent_child\"],\"other_requirements\":[\"The veteran must meet one of the source's qualifying conditions, including 100% permanent-and-total service-connected disability, specified service-related deaths, or missing-in-action/prisoner-of-war status. The student must be a Nebraska resident at a participating school; dependent and degree limits apply.\"]},\"how_to_apply\":[\"Submit the downloadable application in time for processing and certification before the school term begins.\"],\"application_url\":\"https://veterans.nebraska.gov/waiver-tuition-program\",\"source_url\":\"https://veterans.nebraska.gov/waiver-tuition-program\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"NH\":[{\"id\":\"nh-standard-optional-veterans-tax-credit\",\"name\":\"Standard and Optional Veterans' Tax Credit\",\"state\":\"NH\",\"scope\":\"municipal\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Provides a property-tax credit for qualifying residents. Municipalities may adopt an optional credit in place of the standard credit.\",\"value\":\"Credit amount depends on municipal adoption and applicable rules\",\"source_name\":\"New Hampshire Revised Statutes — RSA 72:28, Standard and Optional Veterans' Tax Credit\",\"eligibility\":{\"who\":[\"veteran\",\"spouse\",\"surviving_spouse\"],\"other_requirements\":[\"The statute lists qualifying service and disability circumstances for veterans and specified spouses or surviving spouses. The optional credit requires municipal adoption; review the statute and contact the local assessor.\"]},\"how_to_apply\":[\"Contact the local assessing official to confirm municipal adoption, eligibility, and application steps.\"],\"application_url\":\"https://gc.nh.gov/rsa/html/V/72/72-28.htm\",\"source_url\":\"https://gc.nh.gov/rsa/html/V/72/72-28.htm\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"NJ\":[],\"NM\":[{\"id\":\"nm-veterans-hiring-preference\",\"name\":\"New Mexico Personnel Office Veterans Hiring Preference\",\"state\":\"NM\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"employment\",\"summary\":\"Adds preference points to passing screening-exam scores for qualifying veterans and current National Guard members.\",\"value\":\"Five points for honorably discharged veterans; ten points for honorably discharged veterans with a service-connected disability\",\"source_name\":\"New Mexico Department of Veterans' Services — Other State Benefits\",\"eligibility\":{\"who\":[\"veteran\"],\"discharge\":[\"honorable\"],\"other_requirements\":[\"The state page also lists current National Guard members; see the official source for the preference details and screening-exam requirements.\"]},\"how_to_apply\":[\"Review the State Personnel Office screening examinations and veterans preference instructions.\"],\"application_url\":\"https://www.nmdvs.org/benefits/\",\"source_url\":\"https://www.nmdvs.org/benefits/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"nm-recently-returned-veteran-employer-tax-credit\",\"name\":\"Business Tax Credit for Hiring Recently Returned Veterans\",\"state\":\"NM\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"employment\",\"summary\":\"A New Mexico business may qualify for a tax credit for hiring a recently returned veteran. This is a business tax credit, not a payment to the veteran.\",\"value\":\"Up to $1,000 per hire, as stated on the state veterans-services page\",\"source_name\":\"New Mexico Department of Veterans' Services — Other State Benefits\",\"eligibility\":{\"other_requirements\":[\"The credit is for qualifying businesses; confirm current requirements with the New Mexico Taxation and Revenue Department.\"]},\"how_to_apply\":[\"Contact the New Mexico Taxation and Revenue Department for current eligibility and claiming instructions.\"],\"application_url\":\"https://www.nmdvs.org/benefits/\",\"source_url\":\"https://www.nmdvs.org/benefits/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"nm-special-macarthur-service-medal\",\"name\":\"Special MacArthur Service Medal\",\"state\":\"NM\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"other\",\"summary\":\"A New Mexico recognition medal for qualifying members of the 200th or 515th Coast Artillery Units who served under General MacArthur in the Philippine Islands during World War II; surviving family members may also receive it.\",\"value\":\"State recognition medal\",\"source_name\":\"New Mexico Department of Veterans' Services — Other State Benefits\",\"eligibility\":{\"other_requirements\":[\"The service member must have been a New Mexico resident when entering service and served in a specified unit and theater during World War II. The source also identifies surviving family members.\"]},\"how_to_apply\":[\"Contact the New Mexico Department of Veterans' Services to ask about current application instructions.\"],\"application_url\":\"https://www.nmdvs.org/benefits/\",\"source_url\":\"https://www.nmdvs.org/benefits/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"NV\":[{\"id\":\"nv-disabled-veteran-hunting-fishing-license\",\"name\":\"Disabled Veteran Specialty Combination Hunting and Fishing License\",\"state\":\"NV\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"recreation\",\"summary\":\"Nevada provides an annual specialty combination hunting and fishing license for qualifying resident veterans with disabilities.\",\"value\":\"Annual specialty combination license; fee details are on the agency page\",\"source_name\":\"Nevada Revised Statutes 502.072 and Nevada Department of Wildlife — Apply and Buy: Fishing\",\"eligibility\":{\"who\":[\"veteran\"],\"min_rating\":50,\"discharge\":[\"honorable\"],\"other_requirements\":[\"Requires bona fide Nevada residency, a VA-rated service-connected disability of at least 50%, and an honorable discharge or certificate of satisfactory service.\"]},\"how_to_apply\":[\"Process the initial application at a Nevada Department of Wildlife office.\"],\"application_url\":\"https://www.ndow.org/apply-buy/fishing/\",\"source_url\":\"https://www.leg.state.nv.us/NRS/NRS-502.html\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"nv-purple-heart-veteran-child-fee-waiver\",\"name\":\"Purple Heart Veteran and Child Fee Waiver\",\"state\":\"NV\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"education\",\"summary\":\"Nevada public higher-education institutions waive registration, laboratory, and other mandatory fees for a Purple Heart recipient. A child of a qualifying veteran may also qualify.\",\"value\":\"Waiver of eligible mandatory fees after applicable federal education benefits\",\"source_name\":\"Nevada Revised Statutes — Section 396.5443, Purple Heart Veteran or Child Fee Waiver\",\"eligibility\":{\"who\":[\"veteran\",\"dependent_child\"],\"special_statuses\":[\"Purple Heart\"],\"other_requirements\":[\"For a child's eligibility, the veteran must be or have been a Nevada resident at death and the child must have graduated from a Nevada high school. Contact the institution about current federal-benefit coordination and eligibility rules.\"]},\"how_to_apply\":[\"Contact the relevant Nevada System of Higher Education institution for application steps; the statute does not specify them.\"],\"application_url\":\"https://www.leg.state.nv.us/NRS/NRS-396.html\",\"source_url\":\"https://www.leg.state.nv.us/NRS/NRS-396.html\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"NY\":[{\"id\":\"ny-alternative-veterans-property-tax-exemption\",\"name\":\"Alternative Veterans Exemption\",\"state\":\"NY\",\"scope\":\"municipal\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"A municipal-option property tax exemption for residential property may be available to qualifying veterans. Participating municipalities and school districts decide whether to offer it.\",\"value\":\"Exemption amount depends on local adoption and applicable rules\",\"source_name\":\"New York State Department of Taxation and Finance — Veterans Exemptions\",\"eligibility\":{\"who\":[\"veteran\"],\"other_requirements\":[\"The veteran must have served during a designated time of war or received an expeditionary medal. The municipality and school district must have adopted the exemption.\"]},\"how_to_apply\":[\"Apply to the local assessor. Deadlines are usually March 1, but confirm with the assessor.\"],\"application_url\":\"https://www.tax.ny.gov/pit/property/exemption/vetexempt.htm\",\"source_url\":\"https://www.tax.ny.gov/pit/property/exemption/vetexempt.htm\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"ny-veteran-vehicle-registration-fee-exemption\",\"name\":\"State Vehicle Registration Fee Exemption\",\"state\":\"NY\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"vehicle\",\"summary\":\"New York's veterans agency says veterans may qualify for exemption from vehicle registration and plate fees. Detailed eligibility is not stated on the summary page.\",\"value\":\"Exemption from eligible registration and plate fees\",\"source_name\":\"New York State Department of Veterans' Services — Disabled Veterans\",\"eligibility\":{\"who\":[\"veteran\"],\"other_requirements\":[\"The state veterans-agency summary lists this under disabled veterans but does not state the qualifying disability rating; confirm requirements with DMV.\"]},\"how_to_apply\":[\"Contact the New York State Department of Motor Vehicles for current requirements and application steps.\"],\"application_url\":\"https://veterans.ny.gov/disabled-veterans\",\"source_url\":\"https://veterans.ny.gov/disabled-veterans\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"ny-disabled-veteran-hunting-fishing-license\",\"name\":\"Reduced-Fee Hunting and Fishing Licenses\",\"state\":\"NY\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"recreation\",\"summary\":\"New York's veterans agency says disabled veterans may qualify for reduced-fee hunting and fishing licenses and preference for Deer Management Permits.\",\"value\":\"Reduced license fees; specific amount not stated on the summary page\",\"source_name\":\"New York State Department of Veterans' Services — Disabled Veterans\",\"eligibility\":{\"who\":[\"veteran\"],\"other_requirements\":[\"The summary page does not specify the qualifying disability rating or license cost; verify current requirements with the Department of Environmental Conservation.\"]},\"how_to_apply\":[\"Contact the New York State Department of Environmental Conservation for current license qualifications and application instructions.\"],\"application_url\":\"https://veterans.ny.gov/disabled-veterans\",\"source_url\":\"https://veterans.ny.gov/disabled-veterans\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"OH\":[{\"id\":\"oh-war-orphan-disabled-veterans-children-scholarship\",\"name\":\"Ohio War Orphan and Severely Disabled Veterans' Children Scholarship\",\"state\":\"OH\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"education\",\"summary\":\"Provides tuition assistance to eligible children of deceased or severely disabled Ohio veterans who served during a declared war or conflict.\",\"value\":\"Tuition assistance; amount depends on program rules\",\"source_name\":\"Ohio Department of Higher Education — War Orphan and Severely Disabled Veterans' Children Scholarship\",\"eligibility\":{\"who\":[\"dependent_child\"],\"other_requirements\":[\"The student must be an Ohio resident, attend full-time undergraduate study at an eligible Ohio college, and apply between ages 16 and 24. Parent veteran must meet the program's service and disability or death requirements.\"]},\"how_to_apply\":[\"Apply electronically or submit a paper application through the Ohio Department of Higher Education.\"],\"application_url\":\"https://highered.ohio.gov/educators/financial-aid/sgs/wos/wos\",\"source_url\":\"https://highered.ohio.gov/educators/financial-aid/sgs/wos/wos\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"OK\":[{\"id\":\"ok-disabled-veteran-property-tax-exemption\",\"name\":\"Disabled Veteran Property Tax Exemption\",\"state\":\"OK\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Exempts a qualifying Oklahoma veteran's homestead from property tax.\",\"value\":\"Homestead property-tax exemption\",\"source_name\":\"Oklahoma — State Benefits\",\"eligibility\":{\"who\":[\"veteran\"],\"min_rating\":100,\"p_and_t\":true,\"requires_homeowner\":true,\"discharge\":[\"honorable\"],\"other_requirements\":[\"Applicant must be an Oklahoma resident. The disability must be permanent and service-connected and certified by the VA; the source describes qualifying causes related to military service.\"]},\"how_to_apply\":[\"Contact the Oklahoma Department of Veterans Affairs for help obtaining the VA certification letter and confirm filing steps with the local assessor.\"],\"application_url\":\"https://oklahoma.gov/okstep/claims-benefits/state-benefits.html\",\"source_url\":\"https://oklahoma.gov/okstep/claims-benefits/state-benefits.html\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"ok-veteran-state-parks-museums-admission\",\"name\":\"Free Admission to State Parks and Museums\",\"state\":\"OK\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"recreation\",\"summary\":\"Provides free admission to state-owned or state-operated parks and museums for qualifying veterans.\",\"value\":\"Free admission\",\"source_name\":\"Oklahoma — State Benefits\",\"eligibility\":{\"who\":[\"veteran\"],\"discharge\":[\"honorable\"],\"other_requirements\":[\"Must be a current Oklahoma resident.\"]},\"how_to_apply\":[\"Present a valid Oklahoma driver license or state photo ID and a DD-214 or similar evidence of honorable discharge.\"],\"application_url\":\"https://oklahoma.gov/okstep/claims-benefits/state-benefits.html\",\"source_url\":\"https://oklahoma.gov/okstep/claims-benefits/state-benefits.html\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"ok-disabled-veteran-hunting-fishing-permits\",\"name\":\"Disabled Veteran Hunting and Fishing Permits\",\"state\":\"OK\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"recreation\",\"summary\":\"Provides a free hunting and fishing permit and Wildlife Land Stamp exemption for qualifying resident veterans. The state page also describes a purchasable disability lifetime combination license.\",\"value\":\"Free permit and stamp exemption for qualifying veterans; other license options may have a fee\",\"source_name\":\"Oklahoma — State Benefits\",\"eligibility\":{\"who\":[\"veteran\"],\"other_requirements\":[\"The free-permit provision applies to legal resident veterans with a disability of 60% or more. VA certification is specified for the lifetime combination license; confirm which option applies.\"]},\"how_to_apply\":[\"Review the Oklahoma state-benefits page and confirm current permit application instructions with the relevant state agency.\"],\"application_url\":\"https://oklahoma.gov/okstep/claims-benefits/state-benefits.html\",\"source_url\":\"https://oklahoma.gov/okstep/claims-benefits/state-benefits.html\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"OR\":[{\"id\":\"or-disabled-veterans-property-tax-exemption\",\"name\":\"Disabled Veterans' Property Tax Exemption\",\"state\":\"OR\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"A qualified disabled veteran may exempt some assessed value of a homestead from property taxes.\",\"value\":\"Exemption from some assessed value; amount not stated on this page\",\"source_name\":\"Oregon Department of Veterans' Affairs — Taxes\",\"eligibility\":{\"who\":[\"veteran\"],\"other_requirements\":[\"The veteran must be certified as at least 40% disabled by the VA or an Armed Forces branch, or annually by a licensed physician.\"]},\"how_to_apply\":[\"Contact the county assessor or review the veteran forms through the Oregon Department of Revenue.\"],\"application_url\":\"https://www.oregon.gov/odva/Benefits/Pages/Taxes.aspx\",\"source_url\":\"https://www.oregon.gov/odva/Benefits/Pages/Taxes.aspx\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"or-disabled-veteran-hunting-fishing-license\",\"name\":\"Disabled Veteran License and Tag\",\"state\":\"OR\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"recreation\",\"summary\":\"Eligible service-connected disabled veterans may qualify for a free combination license covering hunting, fishing, shellfish, and a Columbia River Basin Endorsement. The state page also notes a resident disabled-veteran elk tag option.\",\"value\":\"Free combination license; the page also lists a $25 elk tag option for qualifying resident disabled veterans\",\"source_name\":\"Oregon Department of Veterans' Affairs — Recreation\",\"eligibility\":{\"who\":[\"veteran\"],\"min_rating\":25,\"other_requirements\":[\"The source describes eligibility for service-connected disabled veterans. Verify current license and tag rules with Oregon Department of Fish and Wildlife.\"]},\"how_to_apply\":[\"Follow the linked Oregon Department of Fish and Wildlife information on the state veterans-agency recreation page.\"],\"application_url\":\"https://www.oregon.gov/odva/Benefits/Pages/Recreation.aspx\",\"source_url\":\"https://www.oregon.gov/odva/Benefits/Pages/Recreation.aspx\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"or-veterans-educational-bridge-grant\",\"name\":\"Veterans Educational Bridge Grant\",\"state\":\"OR\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"education\",\"summary\":\"Helps eligible Oregon veterans whose progress in an Oregon-based education or training program is interrupted by specified financial or course-availability hardship.\",\"value\":\"Lifetime maximum of $10,000, including up to $5,000 for student-account debt\",\"source_name\":\"Oregon Department of Veterans' Affairs — Veterans Educational Bridge Grant\",\"eligibility\":{\"who\":[\"veteran\"],\"other_requirements\":[\"Eligibility is limited to the qualifying education, training, financial-hardship, course-availability, or student-account circumstances described on the program page.\"]},\"how_to_apply\":[\"Review the eligibility criteria, complete the appropriate application and document checklist, and submit through the secure upload link on the program page.\"],\"application_url\":\"https://www.oregon.gov/odva/Agency-Programs/Grants/Pages/Educational-Bridge-Grant.aspx\",\"source_url\":\"https://www.oregon.gov/odva/Agency-Programs/Grants/Pages/Educational-Bridge-Grant.aspx\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"PA\":[{\"id\":\"pa-disabled-veteran-real-estate-tax-exemption\",\"name\":\"Disabled Veterans Real Estate Tax Exemption\",\"state\":\"PA\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Pennsylvania exempts the principal dwelling of qualifying 100% service-connected disabled veterans from real estate taxes. Each county administers the exemption and applies its own financial-need review; income limits are not published and are evaluated case by case.\",\"value\":\"Full exemption from real estate taxes on the principal residence\",\"source_name\":\"PA DMVA — Application for Disabled Veterans Real Estate Tax Exemption (OVA-BVP-001)\",\"eligibility\":{\"who\":[\"veteran\",\"surviving_spouse\"],\"min_rating\":100,\"requires_homeowner\":true,\"discharge\":[\"honorable\"],\"wartime_required\":true,\"other_requirements\":[\"Must demonstrate financial need to the county; there is no single statewide income limit. Select a county on the map below for local details.\",\"On the veteran's death, the exemption may pass to a widowed spouse who demonstrates financial need.\"]},\"how_to_apply\":[\"File DMVA form OVA-BVP-001 with the county board of assessment appeals or county veterans affairs office, including proof of income and expenses.\"],\"application_url\":\"https://www.pa.gov/content/dam/copapwp-pagov/en/dmva/documents/veterans/vetconnect/documents/ova-bvp-001%20application%20for%20disabled%20veterans%20real%20estate%20tax%20exemption%20(oct%202026).pdf\",\"source_url\":\"https://www.pa.gov/content/dam/copapwp-pagov/en/dmva/documents/veterans/vetconnect/documents/ova-bvp-001%20application%20for%20disabled%20veterans%20real%20estate%20tax%20exemption%20(oct%202026).pdf\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\",\"notes\":\"Statutory authority is 51 Pa.C.S. §§ 8901–8903, as referenced by county program pages.\"}],\"RI\":[{\"id\":\"ri-veterans-property-tax-exemption\",\"name\":\"Veterans' Property Tax Exemption\",\"state\":\"RI\",\"scope\":\"municipal\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"Rhode Island law provides a $1,000 property exemption for qualifying veterans; specific municipalities have different or additional provisions.\",\"value\":\"$$1,000 statutory exemption; local provisions may differ\",\"source_name\":\"Rhode Island General Laws — Section 44-3-4, Veterans' Exemptions\",\"eligibility\":{\"who\":[\"veteran\",\"surviving_spouse\"],\"discharge\":[\"honorable\",\"general\",\"oth\",\"other\"],\"other_requirements\":[\"Qualifying service includes the conflicts and other service described in state law. An unmarried surviving spouse may also qualify. Check local municipal provisions and confirm the applicable discharge standard.\"]},\"how_to_apply\":[\"Contact the local tax assessor to confirm municipal provisions and application steps; the statute does not specify a filing procedure.\"],\"application_url\":\"https://webserver.rilegislature.gov/Statutes/TITLE44/44-3/44-3-4.htm\",\"source_url\":\"https://webserver.rilegislature.gov/Statutes/TITLE44/44-3/44-3-4.htm\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"ri-disabled-american-veterans-tuition-waiver\",\"name\":\"Disabled American Veterans Tuition Waiver\",\"state\":\"RI\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"education\",\"summary\":\"Eligible Rhode Island residents may receive a tuition waiver; other required fees remain payable.\",\"value\":\"Tuition waived; other required fees remain payable\",\"source_name\":\"University of Rhode Island — Disabled American Veterans Tuition Waiver\",\"eligibility\":{\"who\":[\"veteran\"],\"min_rating\":10,\"other_requirements\":[\"Requires Rhode Island residency and a VA service-related disability of at least 10%. Applicants must use financial aid first, including applying through FAFSA.\"]},\"how_to_apply\":[\"Follow the University of Rhode Island application instructions and apply for financial aid through FAFSA.\"],\"application_url\":\"https://web.uri.edu/veterans/benefits/disabled-american-veterans-tuition-waiver-dav/\",\"source_url\":\"https://web.uri.edu/veterans/benefits/disabled-american-veterans-tuition-waiver-dav/\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"SC\":[{\"id\":\"sc-veterans-children-free-tuition\",\"name\":\"Free Tuition for Certain Veterans' Children\",\"state\":\"SC\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"education\",\"summary\":\"A qualifying child of a wartime veteran may attend a state-supported college, university, or post-high-school technical education institution without tuition, while maintaining satisfactory work and conduct.\",\"value\":\"Tuition waived at eligible state-supported institutions\",\"source_name\":\"South Carolina Code of Laws — Section 59-111-20, Free Tuition for Certain Veterans' Children\",\"eligibility\":{\"who\":[\"dependent_child\"],\"other_requirements\":[\"Student must be 26 or younger and pursuing an undergraduate degree. The veteran must have served honorably during a war period and meet at least one statutory condition, such as being killed in action, permanently and totally disabled, a prisoner of war, missing in action, or awarded the Medal of Honor or Purple Heart. Residency requirements apply.\"]},\"how_to_apply\":[\"Apply to and obtain approval from the South Carolina Department of Veterans' Affairs.\"],\"application_url\":\"https://www.scstatehouse.gov/code/t59c111.php\",\"source_url\":\"https://www.scstatehouse.gov/code/t59c111.php\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"sc-disabled-veteran-homestead-tax-exemption\",\"name\":\"Disabled Veteran Homestead Property Tax Exemption\",\"state\":\"SC\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"property_tax\",\"summary\":\"South Carolina law exempts the qualifying veteran's house from ad valorem taxation. The law also covers qualifying unmarried surviving spouses who live in and own the house, and certain surviving spouses of service members killed in action.\",\"value\":\"Exemption from ad valorem tax on qualifying house\",\"source_name\":\"South Carolina Code of Laws — Section 12-37-220, General Exemption from Taxes\",\"eligibility\":{\"who\":[\"veteran\",\"surviving_spouse\"],\"min_rating\":100,\"p_and_t\":true,\"requires_homeowner\":true,\"other_requirements\":[\"The veteran must be permanently and totally disabled as a result of a service-connected disability. A county service officer must certify the disability; surviving-spouse conditions are specified in the law.\"]},\"how_to_apply\":[\"Obtain the required certificate from the county service officer and file it with the South Carolina Department of Revenue.\"],\"application_url\":\"https://www.scstatehouse.gov/code/t12c037.php\",\"source_url\":\"https://www.scstatehouse.gov/code/t12c037.php\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"SD\":[{\"id\":\"sd-veterans-bonus\",\"name\":\"South Dakota Veterans Bonus\",\"state\":\"SD\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"financial\",\"summary\":\"Offers qualifying applicants up to $500 for service from August 2, 1990 through December 31, 1992, and a separate bonus of up to $500 for qualifying service after January 1, 1993.\",\"value\":\"Up to $500 for each of the listed qualifying service periods\",\"source_name\":\"South Dakota Department of Veterans Affairs — Bonus\",\"eligibility\":{\"who\":[\"veteran\"],\"other_requirements\":[\"Applicants must have been South Dakota legal residents for at least six months before the active-duty period. Active-duty training does not qualify.\"]},\"how_to_apply\":[\"Use the application linked on the state page. The page gives mail and email request instructions for applicants living outside the state.\"],\"application_url\":\"https://vetaffairs.sd.gov/benefits/State/Veterans%20Bonus.aspx\",\"source_url\":\"https://vetaffairs.sd.gov/benefits/State/Veterans%20Bonus.aspx\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"},{\"id\":\"sd-reduced-fee-small-game-fishing-license\",\"name\":\"Reduced-Fee Small Game and Fishing License\",\"state\":\"SD\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"recreation\",\"summary\":\"South Dakota residents may qualify for a reduced-fee small game and fishing license under specified disability or former-prisoner-of-war conditions.\",\"value\":\"Reduced license fee; amount not specified in the source summary\",\"source_name\":\"South Dakota Department of Veterans Affairs — Hunting and Fishing Licenses\",\"eligibility\":{\"who\":[\"veteran\"],\"other_requirements\":[\"The official page lists qualifying conditions including certain total physical disabilities, VA disability documentation, Social Security disability with military service, or former POW status. Check the source for exact requirements.\"]},\"how_to_apply\":[\"Review the state page's eligibility conditions and contact the listed agency for current application instructions.\"],\"application_url\":\"https://vetaffairs.sd.gov/benefits/State/Hunting%20and%20Fishing%20Licenses.aspx\",\"source_url\":\"https://vetaffairs.sd.gov/benefits/State/Hunting%20and%20Fishing%20Licenses.aspx\",\"last_verified\":\"$D2026-11-05T00:00:00.000Z\"}],\"TN\":[],\"TX\":[{\"id\":\"tx-hazlewood-act\",\"name\":\"Hazlewood Act\",\"state\":\"TX\",\"scope\":\"state\",\"counties\":\"all\",\"category\":\"education\",\"summary\":\"Provides eligible veterans up to 150 hours of tuition exemption, including most fees, at Texas public institutions of higher education. It does not cover living expenses, books, or supplies; eligible veterans may be able to share unused hours with a child.\",\"value\":\"Up to 150 credit hours of tuition and most fees\",\"source_name\":\"Texas Veterans Commission — Hazlewood Act\",\"eligibility\":{\"who\":[\"veteran\",\"dependent_child\"],\"discharge\":[\"honorable\",\"general\"],\"other_requirements\":[\"The
